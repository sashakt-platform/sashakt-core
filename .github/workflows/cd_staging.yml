name: Deploy to Staging

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging-core
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Pull latest changes and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m

          script: |
            set -euxo pipefail
            cd /home/ubuntu/src/sashakt-core

            # .env is untracked and CD never writes it — fail loudly rather
            # than letting compose die on "Variable not set" later.
            test -f .env

            git fetch --prune origin main
            git reset --hard origin/main
            git rev-parse --short HEAD

            docker compose -f docker-compose.yml up -d --build \
              --remove-orphans --wait --wait-timeout 300

            # Each build orphans the previous image; on a small root volume
            # that becomes a disk-full outage a few weeks of deploys later.
            docker image prune -f
            df -h / | tail -1

            echo "Deployment completed."
